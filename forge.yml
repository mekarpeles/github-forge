# forge.yml — what webhooks we subscribe to and how we respond.
#
# No secrets here (FORGE_SECRET lives in .env, which is gitignored). ${VAR}
# is filled from the environment.

# Repo to watch. Prefer setting FORGE_REPO in .env; this is a fallback.
repo: ${FORGE_REPO}

# Webhook event types to subscribe to (passed to `gh webhook forward`).
events:
  - issues
  - pull_request
  - issue_comment

# event.action  ->  job file. A job receives ctx (event, action, payload, repo,
# sender, log, run, gh) plus ctx.config — this route's `config:` block.
# Resolution: an exact "event.action" wins, else a bare "event", else the
# jobs/<event>.<action>.js file convention.
routes:
  # Log everything, so you can see it working (logs/events.jsonl).
  - on: issues
    run: jobs/log.js
  - on: pull_request
    run: jobs/log.js
  - on: issue_comment
    run: jobs/log.js

